<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="50%" stop-color="#92FE9D" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseRing {
      0% { r: 50px; opacity: 0.4; }
      50% { r: 75px; opacity: 0.1; }
      100% { r: 50px; opacity: 0.4; }
    }
    .orb-glow {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-badge-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .floating-badge-2 {
      animation: floatPill2 6s ease-in-out infinite 1s;
    }
    .pulse-radar {
      animation: pulseRing 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Light In Background (behind text) -->
  <g opacity="0.5">
    <circle class="orb-glow" cx="200" cy="90" r="120" fill="#00c9ff" filter="url(#glow)" />
    <circle class="orb-glow" cx="1020" cy="240" r="140" fill="#0072ff" filter="url(#glow)" />
    <circle class="orb-glow" cx="620" cy="300" r="100" fill="#92fe9d" filter="url(#glow)" />
  </g>

  <!-- Flow / Network Connections (Subtle decorative lines in background) -->
  <path d="M 80 300 Q 300 240 600 290 T 1120 200" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,6" />
  <path d="M 120 80 Q 400 160 800 110 T 1150 120" fill="none" stroke="#92FE9D" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8,8" />

  <!-- Dynamic Floating Decorative Tags (Offset below and to the side, foreground stays crisp) -->
  <g class="floating-badge-1">
    <g transform="translate(850, 60)">
      <rect width="150" height="36" rx="18" fill="url(#cardGrad1)" stroke="#00C9FF" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="22" cy="18" r="5" fill="#00C9FF" />
      <text x="36" y="23" fill="#E2E8F0" class="badge-text">⚡ Async / ASGI</text>
    </g>
  </g>

  <g class="floating-badge-2">
    <g transform="translate(1015, 115)">
      <rect width="140" height="36" rx="18" fill="url(#cardGrad1)" stroke="#92FE9D" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="22" cy="18" r="5" fill="#92FE9D" />
      <text x="36" y="23" fill="#E2E8F0" class="badge-text">🔒 Type-Safe</text>
    </g>
  </g>

  <g class="floating-badge-1">
    <g transform="translate(890, 170)">
      <rect width="170" height="36" rx="18" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="22" cy="18" r="5" fill="#38BDF8" />
      <text x="36" y="23" fill="#E2E8F0" class="badge-text">🚀 High Throughput</text>
    </g>
  </g>

  <!-- Foreground Content: Header & Titles Guaranteed Legible -->
  <g transform="translate(80, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 65)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="19" fill="#38BDF8" class="badge-text" font-size="12">🌐 PRODUCTION WEB ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="url(#primaryGrad)" class="title-text">Awesome Backend Web Frameworks</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="195" fill="url(#subGrad)" class="sub-text">Curated guide to high-performance Python web services, async APIs, ASGI runtimes &amp; PaaS solutions</text>

    <!-- Bottom Feature Badges / Highlights Bar -->
    <g transform="translate(0, 240)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">ASGI &amp; WSGI</text>
        <text x="16" y="42" fill="#F8FAFC" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">FastAPI &amp; Starlette</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(195, 0)">
        <rect width="180" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">FULL-STACK ENTERPRISE</text>
        <text x="16" y="42" fill="#F8FAFC" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Django &amp; DRF</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(390, 0)">
        <rect width="180" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">HIGH-SPEED MSG/RUST</text>
        <text x="16" y="42" fill="#F8FAFC" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Litestar &amp; Robyn</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(585, 0)">
        <rect width="180" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" fill="#64748B" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">PERFORMANCE RUNTIMES</text>
        <text x="16" y="42" fill="#F8FAFC" font-size="14" font-family="-apple-system, sans-serif" font-weight="700">Granian &amp; Uvicorn</text>
      </g>
    </g>
  </g>

  <!-- Modern Accent Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
</svg>
